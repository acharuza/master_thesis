seed: 123

experiment:
  name: cnn_lstm_pretrain

data:
  train_waveforms: data\EchoNext_train_waveforms.npy
  val_waveforms: data\EchoNext_val_waveforms.npy
  metadata: data\echonext_metadata_100k.csv
  batch_size: 128
  num_workers: 12
  pretrain: true

model:
  rnn_type: lstm
  hidden_dim: 256
  num_layers: 1
  dropout: 0.2

  use_cnn: true

  cnn:
    channels: [32, 64]
    kernels: [7, 5]
    dropout: 0.2

training:
  device: cuda
  epochs: 100

  lr: 0.0005
  weight_decay: 0.0001

  gradient_clip: 1.0
  amp: true
  early_stopping_patience: 15
  early_stopping_min_delta: 0.0005

  scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 5
    min_lr: 0.000001

loss: {}